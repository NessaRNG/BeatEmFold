name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_BIN: ${{ github.workspace }}/.godot-cli/godot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2-stable-v1

      - name: Install Godot 4.7.2 CLI
        run: |
          mkdir -p "$RUNNER_TEMP/godot" .godot-cli
          curl -L --fail -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q -o "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          cp "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"

      - name: Install export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --fail -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -o "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp -a "$RUNNER_TEMP/templates/templates/." ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Verify Godot
        run: $GODOT_BIN --version

      - name: Build release artifacts
        run: bash tools/build_release.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Beat 'Em Fold ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/dist/BeatEmFold-Linux-x86_64
            build/dist/BeatEmFold-Windows-x86_64.exe
            build/dist/BeatEmFold-Web.zip
            build/dist/SHA256SUMS
